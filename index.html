<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>MI VISUAL LIMA</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" id="loginView">
      <div class="brand">
        <div class="brand-mark">MV</div>
        <div>
          <h1>MI VISUAL LIMA</h1>
          <p>Acceso operativo</p>
        </div>
      </div>

      <form id="loginForm" class="form">
        <label>
          Usuario
          <input id="usuario" autocomplete="username" placeholder="Usuario o ID" required>
        </label>

        <label>
          Contraseña
          <div class="password-wrap">
            <input id="clave" type="password" autocomplete="current-password" required>
            <button type="button" class="ghost small" id="togglePassword">Ver</button>
          </div>
        </label>

        <button class="primary" type="submit" id="loginButton">Ingresar</button>
        <p class="message" id="loginMessage"></p>
      </form>
    </section>

    <section class="card hidden" id="changePasswordView">
      <h2>Cambiar contraseña</h2>
      <p class="muted">Debes crear una contraseña nueva antes de continuar.</p>

      <form id="changePasswordForm" class="form">
        <label>
          Contraseña actual
          <input id="actual" type="password" autocomplete="current-password" required>
        </label>
        <label>
          Nueva contraseña
          <input id="nueva" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
          Repetir nueva contraseña
          <input id="repetir" type="password" autocomplete="new-password" minlength="6" required>
        </label>

        <button class="primary" type="submit">Guardar contraseña</button>
        <p class="message" id="changeMessage"></p>
      </form>
    </section>

    <section class="card hidden" id="homeView">
      <div class="topbar">
        <div>
          <p class="eyebrow">MI VISUAL LIMA</p>
          <h2 id="userName">Usuario</h2>
          <p class="muted" id="userProfile"></p>
        </div>
        <button class="ghost" id="logoutButton">Cerrar sesión</button>
      </div>

      <div class="summary">
        <div class="metric">
          <span>Alcance</span>
          <strong id="scopeType">—</strong>
        </div>
        <div class="metric">
          <span>Cuadrillas visibles</span>
          <strong id="crewCount">0</strong>
        </div>
      </div>

      <div class="section-title">
        <h3>Cuadrillas</h3>
        <span id="ggInfo" class="badge hidden">Incluye GG</span>
      </div>
      <div id="crewList" class="crew-list"></div>

      <div class="section-title">
        <h3>Módulos habilitados</h3>
      </div>
      <div id="moduleList" class="module-list"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
